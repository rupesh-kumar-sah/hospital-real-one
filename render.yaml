services:
  - type: web
    name: medicare-hms-backend
    env: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_DRIVER
        value: mysql
      - key: DB_HOST
        sync: false # Set to your Cloudflare Tunnel / Ngrok public domain or IP
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: medicare_hms
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: APP_ENCRYPTION_KEY
        generateValue: true
