services:
  - type: web
    name: medicare-hms-backend
    env: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health.php
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_DRIVER
        value: sqlite
      - key: DB_PATH
        value: /var/www/html/data/hms.db
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: PORT
        value: "10000"
