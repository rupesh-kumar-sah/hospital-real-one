databases:
  - name: medicare-hms-postgres
    type: postgres
    version: 16
    plan: starter
    region: singapore
    databaseName: medicare_hms
    user: hms_user
    ipAllowList: []

services:
  - type: web
    name: medicare-hms-backend
    env: docker
    plan: starter
    region: singapore
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health.php
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_DRIVER
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: medicare-hms-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: medicare-hms-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: medicare-hms-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: medicare-hms-postgres
          property: user
      - key: DB_PASS
        fromDatabase:
          name: medicare-hms-postgres
          property: password
      - key: DB_SSL
        value: "true"
      - key: APP_URL
        value: https://medicare-hms-backend.onrender.com
      - key: FRONTEND_URL
        value: https://medicare-hms.vercel.app
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: RENDER
        value: "true"
      - key: PORT
        value: "10000"
